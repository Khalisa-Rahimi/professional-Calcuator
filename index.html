<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>رسپی فایندر افغانی</title>
       <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
 <style>
        * { font-family: 'Tahoma', sans-serif; }
        .cat-btn.active { background-color: #d97706 !important; color: white !important; }
        .recipe-card { transition: 0.3s; }
        .recipe-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); }
        .timer-running { background-color: #dc2626 !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 50; justify-content: center; align-items: center; padding: 1rem; }
        .modal-content { background: white; border-radius: 1rem; max-width: 42rem; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.5rem; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .modal-header h2 { font-size: 1.5rem; font-weight: bold; color: #92400e; }
        .modal-header button { font-size: 1.5rem; color: #92400e; background: none; border: none; cursor: pointer; }
        .form-group { margin-bottom: 0.75rem; }
        .form-group label { display: block; font-weight: bold; color: #4a4a4a; margin-bottom: 0.25rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 0.5rem; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #d97706; box-shadow: 0 0 0 2px #fbbf24; }
        .submit-btn { width: 100%; background: #16a34a; color: white; padding: 0.75rem; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #15803d; }
    </style>
</head>
<body class="bg-pink-50">

<div class="bg-green-800 text-white p-5 text-center shadow-lg">
    <h1 class="text-3xl font-bold">🍲 رسپی فایندر افغانی</h1>
    <p class="text-sm mt-1">بیش از ۴۰۰ غذای اصیل افغانی با ویدیوهای آموزشی</p>
    <p id="totalFoodCount" class="text-sm mt-1 text-amber-200">تعداد غذاها: ۰</p>
</div>

<div class="container mx-auto p-4">

    <div class="flex flex-wrap justify-center gap-3 mb-4">
        <button onclick="openAddRecipe()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition">
            <i class="fas fa-plus ml-1"></i> افزودن غذای جدید
        </button>
        <button onclick="window.location.href='cooking-together.html'" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition">
            <i class="fas fa-users ml-1"></i> آشپزخانه مشارکتی
        </button>
    </div>

    <div class="max-w-xl mx-auto mb-5">
        <input type="text" id="search" placeholder="🔍 جستجوی غذا..." class="w-full p-3 rounded-xl border-2 border-amber-400 text-lg">
    </div>

    <div class="flex flex-wrap justify-center gap-2 mb-6">
        <button data-cat="all" class="cat-btn px-4 py-1.5 rounded-full bg-amber-600 text-white active">همه</button>
        <button data-cat="پلو" class="cat-btn px-4 py-1.5 rounded-full bg-white border">پلوها</button>
        <button data-cat="فست فود" class="cat-btn px-4 py-1.5 rounded-full bg-white border">فست فود</button>
        <button data-cat="پیش غذا" class="cat-btn px-4 py-1.5 rounded-full bg-white border">پیش غذا</button>
        <button data-cat="شیرینی" class="cat-btn px-4 py-1.5 rounded-full bg-white border">شیرینی‌ها</button>
        <button data-cat="آش" class="cat-btn px-4 py-1.5 rounded-full bg-white border">آش و سوپ</button>
    </div>

    <div class="text-center mb-4"><span id="result" class="bg-amber-100 px-4 py-1 rounded-full text-sm"></span></div>

    <div id="recipesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <div id="moreDiv" class="text-center mt-6 hidden">
        <button id="moreBtn" class="bg-amber-600 text-white px-6 py-2 rounded-full">بیشتر +</button>
    </div>
</div>

<!-- مودال افزودن غذای جدید -->
<div id="addRecipeModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-plus-circle ml-2"></i> افزودن غذای جدید</h2>
            <button onclick="closeAddRecipe()">&times;</button>
        </div>
        
        <div class="form-group">
            <label>نام غذا <span class="text-red-500">*</span></label>
            <input type="text" id="newName" placeholder="مثلاً: قابلی پلو">
        </div>
        
        <div class="form-group">
            <label>دسته‌بندی <span class="text-red-500">*</span></label>
            <select id="newCategory">
                <option value="پلو">پلو</option>
                <option value="فست فود">فست فود</option>
                <option value="پیش غذا">پیش غذا</option>
                <option value="شیرینی">شیرینی</option>
                <option value="آش">آش</option>
            </select>
        </div>
        
        <div class="form-group">
            <label>زمان پخت (دقیقه)</label>
            <input type="number" id="newTime" placeholder="مثلاً: 45">
        </div>
        
        <div class="form-group">
            <label>آدرس عکس (URL)</label>
            <input type="text" id="newImage" placeholder="https://images.unsplash.com/...">
        </div>
        
        <div class="form-group">
            <label>شناسه ویدئوی یوتیوب</label>
            <input type="text" id="newVideo" placeholder="مثلاً: 9sUdPdu8x-4">
        </div>
        
        <div class="form-group">
            <label>مواد لازم <span class="text-red-500">*</span></label>
            <textarea id="newIngredients" rows="4" placeholder="هر خط یک ماده&#10;مثلاً:&#10;🥩 گوشت گوسفندی: ۵۰۰ گرم&#10;🍚 برنج: ۳ پیمانه"></textarea>
        </div>
        
        <div class="form-group">
            <label>طرز تهیه <span class="text-red-500">*</span></label>
            <textarea id="newInstructions" rows="4" placeholder="هر خط یک مرحله&#10;مثلاً:&#10;مرحله 1: گوشت را بپزید&#10;مرحله 2: برنج را آبکش کنید"></textarea>
        </div>
        
        <div class="form-group">
            <label>منطقه اصالت</label>
            <input type="text" id="newOrigin" placeholder="مثلاً: کابل">
        </div>
        
        <div class="form-group">
            <label>سطح دشواری</label>
            <select id="newDifficulty">
                <option value="آسان">آسان</option>
                <option value="متوسط">متوسط</option>
                <option value="سخت">سخت</option>
            </select>
        </div>
        
        <button id="submitRecipeBtn" class="submit-btn">
            <i class="fas fa-check ml-2"></i> ثبت غذا
        </button>
    </div>
</div>

// متغیرهای اصلی

var foodsData = [];
var currentCat = "all";
var searchText = "";
var showCount = 9;
var filtered = [];
var activeTimers = {};


// توابع ذخیره و بارگذاری
function loadFromStorage() {
    try {
        var saved = localStorage.getItem("afghan_recipes_db");
        if (saved) {
            var parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
                foodsData = parsed;
                return true;
            }
        }
        return false;
    } catch(e) {
        console.log("خطا در بارگذاری:", e);
        return false;
    }
}

function saveToStorage() {
    try {
        localStorage.setItem("afghan_recipes_db", JSON.stringify(foodsData));
        return true;
    } catch(e) {
        console.log("خطا در ذخیره:", e);
        return false;
    }
}

function updateTotalCount() {
    var el = document.getElementById("totalFoodCount");
    if (el) {
        el.innerHTML = "تعداد غذاها: " + foodsData.length;
    }
}


// بارگذاری اولیه
function initializeData() {
    var saved = localStorage.getItem("afghan_recipes_db");
    var existingData = [];
    var existingIds = {};
    
    if (saved) {
        try {
            existingData = JSON.parse(saved);
            if (Array.isArray(existingData)) {
                for (var i = 0; i < existingData.length; i++) {
                    existingIds[existingData[i].id] = true;
                }
            } else {
                existingData = [];
            }
        } catch(e) {
            existingData = [];
        }
    }
    
    var addedCount = 0;
    for (var i = 0; i < FOODS_DB.length; i++) {
        var food = FOODS_DB[i];
        if (!existingIds[food.id]) {
            existingData.push(food);
            addedCount++;
        }
    }
    
    existingData.sort(function(a, b) {
        return a.id - b.id;
    });
    
    foodsData = existingData;
    saveToStorage();
    console.log("✅ " + foodsData.length + " غذا بارگذاری شد");
    return foodsData;
}

// بارگذاری اولیه
initializeData();
updateTotalCount();


// فیلتر و رندر
function filterFoods() {
    filtered = [];
    for (var i = 0; i < foodsData.length; i++) {
        var f = foodsData[i];
        var catOk = (currentCat === "all" || f.category === currentCat);
        var searchOk = (searchText === "" || f.name.indexOf(searchText) !== -1 || f.ingredients.indexOf(searchText) !== -1);
        if (catOk && searchOk) {
            filtered.push(f);
        }
    }
}

function formatTime(seconds) {
    var mins = Math.floor(seconds / 60);
    var secs = seconds % 60;
    return mins + ":" + (secs < 10 ? "0" : "") + secs;
}

function render() {
    var show = filtered.slice(0, showCount);
    var container = document.getElementById("recipesList");
    
    if (show.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-10">❌ غذایی پیدا نشد</div>';
        document.getElementById("result").innerHTML = "0 نتیجه";
        document.getElementById("moreDiv").style.display = "none";
        return;
    }
    
    var html = "";
    for (var i = 0; i < show.length; i++) {
        var f = show[i];
        html += '<div class="recipe-card bg-white rounded-2xl overflow-hidden shadow border">';
        html += '<img src="' + f.image + '" class="w-full h-64 object-cover">';
        html += '<div class="bg-green-700 text-white p-3">';
        html += '<div class="flex justify-between"><span class="font-bold text-lg">' + f.name + '</span><span class="text-xs bg-amber-800 px-2 rounded-full">' + f.category + '</span></div>';
        html += '<div class="flex justify-between mt-1 text-xs"><span><i class="far fa-clock"></i> ' + f.time + ' دقیقه</span><span><i class="fas fa-map-marker-alt"></i> ' + f.origin + '</span><span><i class="fas fa-chart-line"></i> ' + f.difficulty + '</span></div>';
        html += '</div><div class="p-3">';
        
        html += '<button onclick="toggleIng(' + f.id + ')" class="w-full bg-amber-500 text-white py-1 rounded text-sm mb-1 flex justify-center gap-2"><i class="fas fa-shopping-basket"></i> مواد لازم <i id="ingIcon-' + f.id + '" class="fas fa-chevron-down"></i></button>';
        html += '<div id="ing-' + f.id + '" class="hidden bg-amber-50 p-2 rounded text-sm mb-1"><div class="font-bold">🥘 مواد لازم:</div><div class="whitespace-pre-line text-sm">' + f.ingredients + '</div></div>';
        
        html += '<button onclick="toggleIns(' + f.id + ')" class="w-full bg-amber-500 text-white py-1 rounded text-sm mb-1 flex justify-center gap-2"><i class="fas fa-utensils"></i> طرز تهیه <i id="insIcon-' + f.id + '" class="fas fa-chevron-down"></i></button>';
        html += '<div id="ins-' + f.id + '" class="hidden bg-amber-50 p-2 rounded text-sm mb-1"><div class="font-bold">👨‍🍳 طرز تهیه:</div><div class="whitespace-pre-line text-sm">' + f.instructions + '</div></div>';
        
        html += '<button onclick="playVideo(\'' + f.videoId + '\', \'' + f.name + '\')" class="w-full bg-red-600 text-white py-1 rounded text-sm mb-1 flex justify-center gap-2"><i class="fab fa-youtube"></i> مشاهده ویدئو در یوتیوب</button>';
        
        html += '<div class="flex justify-between items-center bg-gray-100 p-2 rounded mt-1"><div class="flex gap-1"><i class="fas fa-hourglass-half text-amber-600"></i><span class="text-sm">تایمر:</span><span id="timer-' + f.id + '" class="font-mono font-bold text-red-600">' + formatTime(f.time * 60) + '</span></div><button onclick="startTimer(' + f.id + ',' + (f.time * 60) + ')" id="timerBtn-' + f.id + '" class="bg-green-600 text-white px-2 py-0.5 rounded text-xs">شروع</button></div>';
        
        html += '</div></div>';
    }
    container.innerHTML = html;
    document.getElementById("result").innerHTML = show.length + " از " + filtered.length + " غذا";
    document.getElementById("moreDiv").style.display = (filtered.length > showCount) ? "block" : "none";
}

function refresh() {
    filterFoods();
    showCount = 9;
    render();
}

function loadMore() {
    showCount += 9;
    render();
}


// توابع دکمه‌ها

window.toggleIng = function(id) {
    var div = document.getElementById("ing-" + id);
    var icon = document.getElementById("ingIcon-" + id);
    if (div.style.display === "none" || div.style.display === "") {
        div.style.display = "block";
        icon.classList.remove("fa-chevron-down");
        icon.classList.add("fa-chevron-up");
    } else {
        div.style.display = "none";
        icon.classList.remove("fa-chevron-up");
        icon.classList.add("fa-chevron-down");
    }
};

window.toggleIns = function(id) {
    var div = document.getElementById("ins-" + id);
    var icon = document.getElementById("insIcon-" + id);
    if (div.style.display === "none" || div.style.display === "") {
        div.style.display = "block";
        icon.classList.remove("fa-chevron-down");
        icon.classList.add("fa-chevron-up");
    } else {
        div.style.display = "none";
        icon.classList.remove("fa-chevron-up");
        icon.classList.add("fa-chevron-down");
    }
};

window.playVideo = function(videoId, recipeName) {
    window.open("https://www.youtube.com/watch?v=" + videoId, "_blank");
};

window.startTimer = function(id, seconds) {
    if (activeTimers[id]) {
        clearInterval(activeTimers[id]);
        delete activeTimers[id];
        document.getElementById("timer-" + id).innerText = formatTime(seconds);
        var btn = document.getElementById("timerBtn-" + id);
        btn.innerHTML = "شروع";
        btn.classList.remove("timer-running");
        btn.classList.add("bg-green-600");
        return;
    }
    
    var left = seconds;
    var timerDisplay = document.getElementById("timer-" + id);
    var actionBtn = document.getElementById("timerBtn-" + id);
    actionBtn.innerHTML = "توقف";
    actionBtn.classList.add("timer-running");
    actionBtn.classList.remove("bg-green-600");
    actionBtn.classList.add("bg-red-600");
    
    var timer = setInterval(function() {
        left--;
        timerDisplay.innerText = formatTime(left);
        if (left <= 0) {
            clearInterval(timer);
            delete activeTimers[id];
            timerDisplay.innerText = formatTime(seconds);
            actionBtn.innerHTML = "شروع";
            actionBtn.classList.remove("timer-running", "bg-red-600");
            actionBtn.classList.add("bg-green-600");
            alert("⏰ زمان پخت به پایان رسید!");
        }
    }, 1000);
    
    activeTimers[id] = timer;
};

// افزودن غذای جدید از طریق فرم

function openAddRecipe() {
    document.getElementById("addRecipeModal").style.display = "flex";
}

function closeAddRecipe() {
    document.getElementById("addRecipeModal").style.display = "none";
}

function addNewRecipe() {
    var name = document.getElementById("newName").value.trim();
    var category = document.getElementById("newCategory").value;
    var time = parseInt(document.getElementById("newTime").value);
    var image = document.getElementById("newImage").value.trim();
    var video = document.getElementById("newVideo").value.trim();
    var ingredients = document.getElementById("newIngredients").value.trim();
    var instructions = document.getElementById("newInstructions").value.trim();
    var origin = document.getElementById("newOrigin").value.trim();
    var difficulty = document.getElementById("newDifficulty").value;
    
    if (!name) {
        alert("❌ لطفاً نام غذا را وارد کنید");
        return;
    }
    if (!ingredients) {
        alert("❌ لطفاً مواد لازم را وارد کنید");
        return;
    }
    if (!instructions) {
        alert("❌ لطفاً طرز تهیه را وارد کنید");
        return;
    }
    
    var maxId = 0;
    for (var i = 0; i < foodsData.length; i++) {
        if (foodsData[i].id > maxId) {
            maxId = foodsData[i].id;
        }
    }
    var newId = maxId + 1;
    
    var newFood = {
        id: newId,
        name: name,
        category: category,
        time: time || 45,
        image: image || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&h=250&fit=crop",
        videoId: video || "dQw4w9WgXcQ",
        ingredients: ingredients,
        instructions: instructions,
        origin: origin || "کابل",
        difficulty: difficulty || "متوسط"
    };
    
    foodsData.push(newFood);
    saveToStorage();
    closeAddRecipe();
    
    document.getElementById("newName").value = "";
    document.getElementById("newTime").value = "";
    document.getElementById("newImage").value = "";
    document.getElementById("newVideo").value = "";
    document.getElementById("newIngredients").value = "";
    document.getElementById("newInstructions").value = "";
    document.getElementById("newOrigin").value = "";
    
    refresh();
    updateTotalCount();
    alert("✅ غذای " + name + " با موفقیت اضافه شد!");
}
