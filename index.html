<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Calculator</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(135deg, #1e293b, #0f172a);
}
.calculator {
    width: 350px;
    background: #1f2937;
    padding: 20px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}
#display {
    width: 100%;
    height: 80px;
    border: none;
    outline: none;
    border-radius: 15px;
    margin-bottom: 20px;
    padding: 15px;
    font-size: 1.8rem;
    text-align: right;
    background: #111827;
    color: white;
}
.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}
button {
    padding: 20px;
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #374151;
    color: white;
    transition: 0.2s;
}
button:hover { opacity: 0.85; }
button:active { transform: scale(0.95); }
.operator { background: #f59e0b; }
.equal { background: #10b981; }
.zero { grid-column: span 2; }
.clear { background: #ef4444; }
</style>
</head>
<body>
<div class="calculator">
    <input type="text" id="display" readonly value="">

    <div class="buttons">
        <button class="clear" onclick="clearAll()">C</button>
        <button class="operator" onclick="appendValue('/')">÷</button>
        <button class="operator" onclick="appendValue('*')">×</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="operator" onclick="appendValue('.')">.</button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="zero" onclick="appendValue('0')">0</button>
    </div>
</div>

<script>
const display = document.getElementById("display");


let expression = "";


const operators = ["+", "-", "*", "/"];

function appendValue(value) {
    const lastChar = expression.slice(-1);
    if (operators.includes(value)) {
        if (expression === "") return;

        if (operators.includes(lastChar)) {
            expression = expression.slice(0, -1) + value;
        } else {
            expression += value;
        }

        display.value = expression;
        return;
    }
    if (value === ".") {
        
        const parts = expression.split(/[\+\-\*\/]/);
        const lastNumber = parts[parts.length - 1];
       
        if (lastNumber.includes(".")) return;

        if (lastNumber === "") {
            expression += "0.";
        } else {
            expression += ".";
        }

        display.value = expression;
        return;
    }

   
    expression += value;
    display.value = expression;
}

function calculate() {
    if (expression === "") return;

   
    while (operators.includes(expression.slice(-1))) {
        expression = expression.slice(0, -1);
    }

    if (expression === "") return;

    try {
       
        const result = eval(expression);
        display.value = result;
        expression = String(result);
    } catch (error) {
        display.value = "Error";
        expression = "";
    }
}

function clearAll() {
    expression = "";
    display.value = "";
}
</script>
</body>
</html>
